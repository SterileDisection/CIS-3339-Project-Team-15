# D2: Render Blueprint - deploys the backend API and the static frontend from this repo.
# Render dashboard > New > Blueprint > pick this repository. Render reads this file, then asks
# for the values marked "sync: false" (they are never stored in git through this file).
# Full steps: README.md > "Deployment".
services:
  # Express API (backend/)
  - type: web
    name: dataplatform-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URL
        sync: false
      - key: ORG_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      # the deployed frontend URL, e.g. https://dataplatform-frontend.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # Vue single page app (frontend/), served as static files from frontend/dist
  - type: web
    name: dataplatform-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback: every path that isn't a real file gets index.html, so refreshing
    # /clientdetails/<id> works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # the deployed API URL, e.g. https://dataplatform-api.onrender.com (read at build time)
      - key: VITE_ROOT_API
        sync: false
